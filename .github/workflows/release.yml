name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore miniz
        shell: pwsh
        run: .\scripts\Restore-Miniz.ps1

      - name: Build x64 release without warnings
        shell: pwsh
        run: .\scripts\Invoke-NativeBuild.ps1 -Configuration Release -Platform x64 -ArtifactDirectory .\.ci-artifacts\build

      - name: Run parser regression tests
        shell: pwsh
        run: .\scripts\Run-Tests.ps1 -Configuration Release -Platform x64 -ResultsDirectory .\.ci-artifacts\tests

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-diagnostics
          path: .ci-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Create checksum
        shell: pwsh
        run: |
          $artifact = ".\x64\Release\EspReader.dll"
          if (-not (Test-Path -LiteralPath $artifact)) {
              throw "Release artifact was not produced: $artifact"
          }

          $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  EspReader.dll" | Set-Content "$artifact.sha256" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            ".\x64\Release\EspReader.dll" `
            ".\x64\Release\EspReader.dll.sha256" `
            --generate-notes `
            --verify-tag
